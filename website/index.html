<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/addons/p5.sound.min.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
    <style>
      /* 전체 페이지 배경색을 부드러운 미색으로 설정 */
      body {
        background-color: #F8F4E6; /* Creamy White */
        font-family: 'Malgun Gothic', 'Dotum', sans-serif; /* 가독성 좋고 부드러운 폰트 */
        color: #333333; /* 짙은 회색으로 편안하게 */
      }
      
      /* 제목 스타일 - 따뜻한 베이지 계열 */
      h1 {
        background-color: #E0B98B; /* Soft Beige */
        color: #6D4C3D; /* Deep Brown Text */
        text-align: center;
        padding: 15px; /* 패딩 추가 */
        border-radius: 10px 10px 0 0; /* 모서리 둥글게 */
        margin-bottom: 0;
      }

      /* 질문 영역 스타일 - 부드러운 파스텔 톤 */
      .question-box {
        background-color: #C0DEDD; /* Soft Mint/Cyan */
        text-align: center;
        padding: 20px;
        margin-top: 0;
        border-radius: 0 0 10px 10px; /* 아래 모서리 둥글게 */
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* 은은한 그림자 */
      }
      
    </style>

    <meta charset="utf-8" />

  </head>
  <body>
    <h1 align="center"> <기후층(氣候層): A Weather Within> </I></h1>
    <p style="background-color:rgb(144, 243, 254);" align="center"> 
    질문 : 당신은 비가 올때 어떤 생각을 하시나요?
    <br/>
    (그저 스쳐지나간 존재들 또는 순간들을 다시금 생각해보세요)
    </p>  
    <p style="background-color:rgb(255, 147, 128)" align="center">
    <script src="sketch.js"></script>
   당신의 그 기억들을 잠시나마 공유해주세요 (30자 이내) : <input id = "word">
   <br/>
    1-30 중 당신이 좋아하는 숫자는 무엇인가요? : <input id="score">
    <br/>
    <button id="submit">submit</button>
</p>
  </body>
</html>
